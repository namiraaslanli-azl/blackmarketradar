[project]
name = "radar"
version = "0.1.0"
description = "Black Market Radar — illegal gambling promotion monitoring (Azerlotereya)"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "celery[redis]>=5.4",
  "httpx>=0.27",
  "dnspython>=2.6",
  "tldextract>=5.1",
  "idna>=3.7",
  "openpyxl>=3.1",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "mmh3>=4.1",
  "python-dateutil>=2.9",
  "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
